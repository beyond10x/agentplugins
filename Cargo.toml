[workspace]
resolver = "2"
members = ["crates/agentplugins-check"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/agentplugins"
authors = ["Beyond10x contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The reader `aep` parses `eval-case/1` and `trace-spec/1` with, so a document this repository's
# gate accepts is one that repository's runner accepts.
serde_yaml = "0.9"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
shlex = "1.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
