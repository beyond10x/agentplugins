[workspace]
resolver = "2"
members = ["crates/agentplugins-check"]

[workspace.package]
version = "0.3.6"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/agentplugins"
authors = ["Beyond10x contributors"]
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
