name: ess-new
kind: ess-new
prompt: |
  I'm starting a small service for a museum's audio-guide desk: visitors borrow physical audio
  guides and return them when leaving. Some languages run out of available guides, and one
  visitor can have at most three guides out at once. Write an ESS
  specification for it in `spec/` and make sure it validates.

  When you're done, list the skills and agents you used, quote any instruction text that confused
  you, and paste the last validation output verbatim.
dir: audiodesk
setup:
  - b10x init ess --host claude --out plan.json
  - b10x setup apply --plan plan.json --yes
measures: [tool_calls, validate, unmapped]
