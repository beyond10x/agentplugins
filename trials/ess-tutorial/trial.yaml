name: ess-tutorial
kind: ess-tutorial
prompt: |
  I'm following tutorial.md. Setup is done. Work through steps 2–8: write the lending spec in
  spec/, validate it, generate docs and OpenAPI into out/, and synthesize canonical conformance IR
  into impl/suite.json. Write the independent in-memory Rust library and native ConformanceTarget
  adapter in impl/; pin ess-conformance and ess-primitives to the tutorial's ESS release, with a
  Cargo.lock. Use the page's stated decisions without asking again. Running code must be Rust.
  Demonstrate step 7's state-guard defect, restore it, then run
  cargo test --locked --manifest-path impl/Cargo.toml -- --nocapture one final time.

  Report both Cargo test counts and actual ESS scenario counts (passed, failed, unsupported and
  error). Quote any confusing text and paste the final validation, synthesis and cargo test output.
dir: library
fixture: fixture
setup:
  - b10x init ess --host claude --out plan.json
  - b10x setup apply --plan plan.json --yes
measures: [tool_calls, validate, synthesis, outputs, cargo_test]
outputs:
  spec: spec/system.yaml
  docs: out/docs
  openapi: out/openapi
  suite: impl/suite.json
  implementation: impl/Cargo.toml
