# Atlas-classified former Pages workflow: repository-owned validation only; deployment authority is forbidden.
# Builds and type-checks the adopter-facing Docusaurus source; Website owns public delivery.
name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the public documentation
        run: npm --prefix website ci && npm --prefix website run typecheck && npm --prefix website run build
      - name: Install the UX gate browser
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: UX gates and ratchet against the built site
        working-directory: website
        run: npm run ux
      - name: Keep the UX gate records
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-gates
          path: website/ux/out
          retention-days: 7
