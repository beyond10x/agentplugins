name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false
      - name: Install the pinned task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify release provenance
        run: cargo run --quiet --locked --bin agentplugins-check -- release verify "${GITHUB_REF_NAME}"
      - name: Run the repository gate
        run: task check

  website:
    name: Build the public documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm --prefix website ci && npm --prefix website run typecheck && npm --prefix website run build

  publish:
    name: Publish GitHub release
    needs: [gate, website]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the annotated tag as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "Agent Plugins ${GITHUB_REF_NAME}" --notes-from-tag
