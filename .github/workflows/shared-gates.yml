name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@f504f163dc04f5a003df6599e4d36002d11bd07e
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
