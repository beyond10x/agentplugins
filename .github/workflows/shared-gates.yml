name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@0f59bdb8a398140606beacca7aa5e322ad5b6570
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
