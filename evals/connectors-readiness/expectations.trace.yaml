format: trace-spec/1
id: eval-case/connectors-readiness
title: Readiness uses the shipped CLI and preserves the diagnostic scope
# Command predicates are checked by agentplugins-check evals check-stream, in both replay
# and live CI. AEP's selectors cannot union host argument names or parse shell help flags.
expectations:
  - id: skill-offered
    statement: the host offered the shared connectors skill
    severity: advisory
    expect:
      env.skill_available:
        skill: connectors:connectors
  - id: completed
    statement: the session completed without a harness error
    expect:
      result:
        is_error: false
        terminal_reason: completed
