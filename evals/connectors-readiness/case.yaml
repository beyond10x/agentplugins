format: eval-case/1
id: connectors-readiness
title: Connector readiness is inspected without changing access or starting a service
workflow: adp/default
states: [implement]
arm: plugin
verdict: held
subject:
  skills: [connectors:connectors]
  paths: [crates/agentplugins-check/src/readiness.rs]
command_contract: connectors-readiness
task: |
  Use connectors to inspect my local Connector readiness. Only diagnose it: do not start a
  daemon, connect a provider, or invoke an external operation. Report warnings even when the
  doctor command exits successfully. Never read credential values.
  Use direct shell commands with literal arguments; this case does not evaluate dynamic shell
  wrappers, variables, or code-mode calls. Command chains and quoted literal paths are supported.
expectations: expectations.trace.yaml
recorded: recorded/
