format: eval-case/1
id: command-drive-agent-turn
title: Asked in words to drive a story, the agent started aep:drive and stopped before any paid launch
workflow: adp/default
states: [implement]
arm: plugin
verdict: held

subject:
  skills: [aep:drive]
  paths:
    - plugins/aep/skills/implementing/references/drive.md

# The operator asks an agent, in words, for what `/aep:drive <story-id>` does, and names no budget.
# The checkout has no task document naming the story. `references/drive.md` stops on both before a
# launch: a task document the operator has not read is drafted, shown and stopped on, and a budget
# the session has not supplied is asked for. The rows decide that the agent started the command,
# that the harness loaded it, that the drive's first step ran, and that no paid run was launched.

task: |
  The operator asked for this, and you are the agent acting on it: "Drive
  `story:credential-store` with `aep:drive`. I have not picked a budget yet." Do not push, tag or
  release.

expectations: expectations.trace.yaml
recorded: recorded/
