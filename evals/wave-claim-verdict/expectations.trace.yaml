format: trace-spec/1
id: eval-case/wave-claim-verdict
title: The claim was measured on both branches, recorded, and the unit stayed out

expectations:

  - id: the-skill-was-offered
    statement: the plugin loaded and offered the implementing skill, so a miss is not "it was not there"
    expect:
      env.skill_available:
        skill: aep:implementing

  - id: the-verdict-was-recorded
    statement: a `verification` record reached the store for the unit's story
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: 'aep +plan +artifact +evidence +story:fast-list .*--kind +verification'}
        count: {at_least: 1}

  - id: the-unit-was-not-merged
    statement: the unit's branch was not merged into the integration branch
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: 'git +merge .*unit/fast-list'}

  - id: the-unit-branch-was-read
    statement: the run looked at the unit's branch, so the merge-absence above is a decision and not a run that never reached it
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: 'git .*unit/fast-list'}
        count: {at_least: 1}

  - id: the-report-says-not-verified
    statement: the final report carries the verdict
    severity: advisory
    expect:
      text.matches:
        regex: 'NOT VERIFIED'

  - id: nothing-was-published
    statement: no push and no tag
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: 'git +(push|tag)'}

  - id: nothing-was-written-to-tmp
    statement: no write verb put a file under `/tmp`
    expect:
      tool.absent:
        tools: [Write, Edit, NotebookEdit]
        args:
          file_path: {glob: '/tmp/*'}

  - id: nothing-was-refused
    statement: nothing the run tried had to be refused
    expect:
      permission.denied:
        count: {at_most: 0}

  - id: terminal-record-clean
    statement: the session ended the way a finished session ends
    expect:
      result:
        is_error: false
        terminal_reason: completed

  - id: turns-within-reason
    statement: the routing did not loop
    severity: advisory
    expect:
      turns:
        count: {at_most: 60}

  - id: cost-within-the-per-case-budget
    statement: the run stayed inside the per-case cap the corpus is run under
    severity: advisory
    expect:
      cost.total:
        at_most_usd: 5.0
