format: eval-case/1
id: ess-schema-new-entity
title: A story introduced a noun and the noun got a typed home before anything was written around it
workflow: adp/default
states: [specify, decompose]
arm: plugin
verdict: held

# Which repository files this case is a case about. `task check` refuses a case whose `agents:` or
# `skills:` name nothing that exists, and `.github/workflows/eval.yml` scopes a live run to the
# cases whose subject the pull request touched.
subject:
  # The ESS skill alone. The one `aep artifact new story` matcher below is the far side of an
  # ordering row, not a claim about the planning skill.
  skills: [ess-schema:ess-schema]

# The skill's § *Starting a domain from nothing* is the subject: *"A story or epic can introduce a
# noun before any specification exists. That is still this skill's job: the domain is drafted first,
# so the noun has a typed home before stories are written around it."* That sentence is an
# **ordering**, which is the one class of claim a transcript decides well.
#
# The three things this case holds the run to, all of them the skill's own words:
#
# 1. the smallest document that validates is written — `system.yaml` and a domain file, nothing that
#    is not required;
# 2. `ess validate` is run over it **before** stories are written around the noun;
# 3. a relation the tree does not settle is left as an `UNMAPPED:` marker, never invented — *"Imports
#    never guess, and a domain an agent drafts is an import."*
#
# ## The skill's name, and an ambiguity this case does not pretend to have settled
#
# The skill's directory is `plugins/ess-schema/skills/schema-validation/` and its `SKILL.md`
# frontmatter declares `name: ess-schema`. Every other skill in this repository has a directory and a
# frontmatter name that agree, so no committed evidence here said which of the two a harness puts
# after the plugin name in its skill list. `the-skill-was-offered` is therefore **advisory**: a live
# run settles the spelling in one line, and until one had, a gating row on the guess would fail this
# case for a reason that is not about behaviour. The behavioural rows below gate.
#
# **The first recording settled it, 2026-09-03: the harness lists the skill by its directory.** The
# opening record's skill inventory carries `ess-schema:schema-validation`, and the run's first tool
# call is `Skill(ess-schema:schema-validation)` — so the skill was offered, the description matched
# the task below on the first turn, and `the-skill-was-offered` gaps purely on the spelling this row
# guessed. Two things could close it and neither is done here, because both reach past this case:
# rename the skill directory to `ess-schema`, which changes the name adopters type and the row in
# `golden-path-end-to-end` too; or re-spell this row, which `crates/agentplugins-check` currently
# refuses — `resolve_skill` reads the frontmatter name and rejects `ess-schema:schema-validation`
# by test. The choice is a repository decision, not a case's.
#
# ## The spelling of the CLI, and why the rows carry both
#
# `aep` in this repository's instructions, `protocol` in the binary's own usage lines, and an adopter
# may have either on `PATH`. Every `aep` matcher below is a regex over both. `ess` has one spelling
# and is matched as one.

task: |
  `story:warehouse-shipment-record` introduces a noun this repository has no typed home for: a
  **shipment**, identified by a `shipment_id`, with a destination.

  Give it one before any story is written around it. There is no ESS specification here yet, so
  write the smallest `ess/1` document that validates — the header and one domain file, and nothing
  that is not required — and run `ess validate` over it.

  The epic also says a shipment has a **carrier**. Nothing in this tree, in any contract, and in no
  artifact says what a carrier is. Do not type it.

  Then report: what you wrote, the verbatim output of `ess validate` with its exit status, and every
  relation you could not settle.

expectations: expectations.trace.yaml
recorded: recorded/

# The run did nothing wrong; what gaps is an observation about the evidence, not about the run.
advisory_gaps:
  - expectation: the-skill-was-offered
    why: >-
      Settled by the first recording (2026-09-03), and still gapping. The harness lists the skill by
      its **directory** — `ess-schema:schema-validation` — and this row asserts the frontmatter name,
      `ess-schema:ess-schema`. The skill was offered and the run invoked it as its first tool call,
      so what gaps is the spelling and not the trigger and not the run. See the case header for the
      two ways to close it and why neither is taken here.
