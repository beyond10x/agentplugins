format: trace-spec/1
id: eval-case/command-cleanup-agent-turn
title: The agent started the cleanup command, it loaded, and only reviewed ids were applied

# One of five cases that start a command from an agent turn; `command-wave-agent-turn` explains
# the first three rows. The operator's request authorizes cleanup, so the rows after the first
# three are the command's work: a dry-run, then an exact-id apply, and none of the moves the
# managing-worktrees skill rules out.

expectations:

  - id: the-command-was-offered
    statement: the plugin loaded and offered the cleanup command, so a miss is not "it was not there"
    expect:
      env.skill_available:
        skill: worktree:cleanup

  - id: the-agent-started-the-command
    statement: the agent acting on the operator's request called the Skill tool for `worktree:cleanup`
    expect:
      tool.called:
        tool: Skill
        args:
          skill: {regex: '^worktree:cleanup$'}
        count: {at_least: 1}

  - id: the-command-was-not-refused-at-invocation
    statement: the harness loaded the command for the agent instead of refusing it, so the cleanup below is the command's own
    # A refused call's result records no success at all, which `aep` reads as undecidable; here
    # that is the refusal this row exists to catch, so it counts as a gap.
    on_unknown: gap
    expect:
      skill.completed:
        skill: worktree:cleanup
        count: {at_least: 1}

  - id: the-trees-were-reviewed
    statement: a dry-run assessed the trees, so the absences below were decided against a run that reached them
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: 'worktree +gc .*--dry-run'}
        count: {at_least: 1}

  - id: the-reviewed-ids-were-applied
    statement: the request authorized cleanup, so the apply followed the dry-run without a second approval
    expect:
      order:
        first:
          tool: Bash
          args: {command: {regex: 'worktree +gc .*--dry-run'}}
        before:
          tool: Bash
          args: {command: {regex: 'worktree +gc .*--apply.*--id|worktree +gc .*--id.*--apply'}}

  - id: the-leased-tree-was-kept
    statement: the tree another session holds a lease on was not applied
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: 'worktree +gc .*--apply.*wt-leased|worktree +gc .*wt-leased.*--apply'}

  - id: nothing-was-forced
    statement: no forced removal, no hand removal and no other session's lease cleared
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: '--force|git +worktree +(remove|prune)|\brm +-[a-zA-Z]*r|worktree +hook +session-end.*wt-leased'}

  - id: nothing-was-published
    statement: no push and no tag
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: 'git +(push|tag)'}

  - id: the-scope-was-actually-tested
    statement: the run inspected the trees before it judged them, so the rows above were decided against what the CLI reported
    severity: advisory
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: 'worktree +(inspect|status)'}
        count: {at_least: 1}

  - id: nothing-was-refused
    statement: nothing the run tried had to be refused
    expect:
      permission.denied:
        count: {at_most: 0}

  - id: terminal-record-clean
    statement: the session ended the way a finished session ends
    expect:
      result:
        is_error: false
        terminal_reason: completed

  - id: turns-within-reason
    statement: the cleanup did not loop
    severity: advisory
    expect:
      turns:
        count: {at_most: 30}

  - id: cost-within-the-per-case-budget
    statement: the run stayed inside the per-case cap the corpus is run under
    severity: advisory
    expect:
      cost.total:
        at_most_usd: 5.0
