format: trace-spec/1
id: eval-case/golden-path-end-to-end
title: The eight steps happened in the order the page publishes, and the CLIs stayed the stores' only writers

# **No row here reads `website/docs/golden-path.md`.** A check that greps the page asserts that a
# sentence is still written, and the page's own claim is that its blocks are what running the
# commands produced — which only a run can hold it to.
#
# Eight steps make this the longest case in the corpus and the one most exposed to `unk`: `order` is
# undecidable when either side never occurs, so a run that stopped at step 3 reports `unk` on the
# later orderings rather than gapping them. That is the honest verdict — nobody found out — and the
# rows that *do* gap on a short run are the ones about the steps it reached.
#
# ## Five rows carry the plugin names of 2026-09-03, and that is not an oversight
#
# All three product plugins were renamed in 0.7.0 — see `CHANGELOG.md` for the map — and every other
# document in this corpus took the new spellings. The five `env.*_available` rows below did not,
# because they are the only rows here that assert what a **recorded transcript contains** rather than
# what an agent did: the harness inventory in
# `recorded/claude-plugin-golden-path-end-to-end.events.jsonl` lists the plugins under the names they
# carried on the day it ran, which is what the session was actually offered. Renaming them was
# measured on that stream: 27 of 27 rows `ok` before, 22 of 27 after, with
# `the-decomposer-was-offered` and `the-planning-skill-was-offered` contradicted outright. A row the
# transcript beside it disproves is not a rename; it is a specification for a run nobody has had.
#
# They move when the case is re-recorded under the new names, which costs a live run at $25 and is
# the operator's call, not this document's. Each carries `recorded-under-this-name` so that the
# repository's retired-name sweep reads it as the quotation it is.

expectations:
  # --- the surfaces the page names were offered -------------------------------------------------

  - id: the-decomposer-was-offered
    statement: the plugin loaded and offered the decomposer, which step 4 dispatches
    expect:
      env.agent_available:
        # The 2026-09-03 recording was made before the rename; see the note above.
        agent: aep-planning:decomposer  # recorded-under-this-name

  - id: the-planning-skill-was-offered
    statement: the planning skill was among those the harness offered
    expect:
      env.skill_available:
        # The 2026-09-03 recording was made before the rename; see the note above.
        skill: aep-planning:planning  # recorded-under-this-name

  - id: the-wave-skill-was-offered
    statement: the wave skill was among those the harness offered, which step 7 runs
    # **Advisory because of the runner, not because of the claim.** This is the one case whose eight
    # steps span three plugins. `aep eval run --plugin-dir` takes one; the other two travel as
    # `--plugin <repo>@<name>@<pin>` (aep 0.44.0), which metaharness places in the scratch config home
    # and, since 0.6.1, also names to the vendor with `--plugin-dir` — the registry placement alone
    # loaded nothing (metaharness probe Q19, answered by the 2026-09-03 recording). A run launched
    # with only `--plugin-dir plugins/aep-plan` still gaps this row for a reason that is not about
    # the plugin, which is why it stays advisory until the recorded stream shows it `ok`. Since the
    # rename the manifest's pins name no plugin this repository still ships, so the replay sends the
    # pins alone and no `--plugin-dir` at all — an argument `aep`'s `ingest_recorded` discards.
    severity: advisory
    expect:
      env.skill_available:
        # The 2026-09-03 recording was made before the rename; see the note above.
        skill: adp:wave  # recorded-under-this-name

  - id: the-ess-skill-was-offered
    statement: the ESS skill was among those the harness offered, which step 3 runs
    # Advisory for the same single-plugin runner limitation described on the wave row.
    severity: advisory
    expect:
      env.skill_available:
        # The 2026-09-03 recording was made before the rename; see the note above.
        skill: ess-schema:ess-schema  # recorded-under-this-name

  - id: the-drive-skill-was-offered
    statement: the experimental drive skill was among those the harness offered, which step 8 runs
    # Advisory for the same single-plugin runner limitation described on the wave row.
    severity: advisory
    expect:
      env.skill_available:
        # The 2026-09-03 recording was made before the rename; see the note above.
        skill: adp:drive  # recorded-under-this-name

  - id: the-work-was-fanned-out
    statement: the page's sub-agents ran as sub-agents
    # The page is explicit that Claude Code dispatches the decomposer, the scopers and the critics as
    # sub-agents. Advisory on the count rather than gating: how many scopers a three-story
    # decomposition needs is the run's call, and the page says the panel is *two to four* critics.
    severity: advisory
    expect:
      subagent.spawned:
        count: {at_least: 4}

  # --- step 1: the scan is evidence, not a plan --------------------------------------------------

  - id: the-repository-was-scanned-before-anything-was-filed
    statement: the scan ran before the first artifact was created
    # § 1: *"A scan is evidence, not a plan, and an agent that starts drafting artifacts out of one
    # has skipped the part where you get to disagree with it."*
    expect:
      order:
        first:
          tool: Bash
          args: {command: {regex: '(aep|protocol) +reverse +scan'}}
        before:
          tool: Bash
          args: {command: {regex: '(aep|protocol) artifact new'}}

  # --- steps 2 through 4: the epic and validated model before stories, the blocker before work ----

  - id: the-epic-was-filed-before-it-was-decomposed
    statement: step 2 finished before step 4 started
    expect:
      order:
        first:
          tool: Bash
          args: {command: {regex: '(aep|protocol) artifact new +epic'}}
        before:
          tool: Bash
          args: {command: {regex: '(aep|protocol) artifact new +story'}}

  - id: the-domain-was-validated-before-it-was-used
    statement: step 3 validated the typed domain before step 4 created a story that rests on it
    expect:
      order:
        first:
          tool: Bash
          args: {command: {regex: 'ess +validate'}}
        before:
          tool: Bash
          args: {command: {regex: '(aep|protocol) artifact new +story'}}

  - id: the-undecided-relation-became-a-blocker-with-an-edge
    statement: the relation the tree does not settle reached the store as a blocked question
    # § 4: *"The `blocks` edge is the point of the whole exercise. A question in a report is read
    # once; a blocker with an edge is found by a command."* One row over both halves, because a
    # blocker without the edge is the failure this asserts against and a run that wrote them in two
    # commands satisfies the alternation.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(?s)((aep|protocol) artifact new +decision-blocker.*--relate +blocks:|artifact +relate .*blocks:)'}
        count: {at_least: 1}

  - id: nothing-was-promoted-before-the-blocker-was-filed
    statement: the blocked question was in the store before any artifact moved through its lifecycle
    # Step 4 precedes step 7, and step 7 is where the first `move` happens. Gating rather than
    # advisory because the page's whole argument is that the question lands *before* work is
    # scheduled around it.
    #
    # `--to` is spelled out because a move is not always a promotion: the second headless run
    # (2026-09-03) created two probe artifacts to look at a template and archived them before the
    # blocker existed, and `artifact move` alone read that as work scheduled. The rungs that schedule
    # work in this store's story and epic ladders are `proposed`, `active` and `implemented`
    # (`aep artifact lifecycle story`); `archived`, `rejected` and `draft` are not.
    expect:
      order:
        first:
          tool: Bash
          args: {command: {regex: '(aep|protocol) artifact new +decision-blocker'}}
        before:
          tool: Bash
          args: {command: {regex: '(aep|protocol) artifact +move .*--to[ =]+(proposed|active|implemented)'}}

  # --- step 6: every verdict is recorded ----------------------------------------------------------

  - id: every-verdict-became-a-review-result
    statement: the panel's verdicts were recorded as immutable `review-result` artifacts, body and all
    # § 6: *"Every verdict is recorded as an artifact carrying a `reviews` edge to what it judged."*
    # `review-result` refuses every edit after the fact, so the body has to arrive with the record —
    # `--from` is the only way it can, which is why this row asserts the pair and not the verb.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(?s)(aep|protocol) artifact new +review-result.*--from'}
        count: {at_least: 1}

  # --- step 7: the lifecycle is walked, not jumped ------------------------------------------------

  - id: the-story-was-walked-through-its-lifecycle
    statement: the story reached `active` through the moves the store allows rather than in one jump
    # § 7 shows the store refusing `draft -> implemented` and naming what is legal from where the
    # artifact stands, then walking it. Two moves is the floor; a run that walked further is fine.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) artifact +move'}
        count: {at_least: 2}

  # --- step 8: the experimental driver is preflighted ---------------------------------------------

  - id: the-driver-was-checked-before-it-was-launched
    statement: the experimental driven run was preflighted before any model-backed walk began
    expect:
      order:
        first:
          tool: Bash
          args: {command: {regex: '(aep|protocol) +doctor'}}
        before:
          tool: Bash
          args: {command: {regex: '(aep|protocol) +drive +run'}}

  # --- the stops a run with no operator passed, each one recorded ---------------------------------

  # The task carries the page's § *Running it without an operator* instruction, because a case is one
  # task with no operator turn in it and the first headless run of this case ended at the first stop.
  # These rows are about the **record** and not about the continuing: the ordering rows above are all
  # satisfied by a run that decided eight things on an operator's behalf and wrote none of them down,
  # which is the failure the instruction guards against.

  - id: every-stop-became-an-approval-record
    statement: a stop the run passed reached the store as an `approval-record` carrying a body
    # § *Running it without an operator*: one record per stop, written at the stop, through the CLI.
    # The body is where the stop, the decision and the question the operator would have been asked
    # go, so this asserts the pair the way `every-verdict-became-a-review-result` does — the verb
    # alone would be satisfied by a record whose body is the kind's template.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(?s)(aep|protocol) artifact new +approval-record.*--from'}
        count: {at_least: 1}

  - id: the-bypass-named-non-interactive-as-its-reason
    statement: the record says why it exists, in the one place a command can find it again
    # The tag is what makes `aep artifact list --kind approval-record` a list of bypasses rather than
    # a list of approvals: a reason that lives only in the body is one no later command can filter on.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(?s)(aep|protocol) artifact new +approval-record.*--tag[ =]+non-interactive'}
        count: {at_least: 1}

  - id: a-record-per-stop-rather-than-one-for-the-run
    statement: the run wrote a record at each stop it passed, not a summary at the end
    # Advisory on the count, gating nowhere: how many stops this task has is partly the run's — how
    # many critic rounds it needed, whether a move was refused for evidence. Three is the floor the
    # page names by name (the critic round, the wave proposal, the driven run's budget) and the number
    # that separates a per-stop record from a single closing one.
    severity: advisory
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) artifact new +approval-record'}
        count: {at_least: 3}

  - id: no-blocker-was-cleared
    statement: the undecided relation was still undecided at the end of the run
    # The first of the two prohibitions the task states. Clearing a blocker *is* the answer to its
    # question, and the question is the thing nobody was there to answer — so the correct end state
    # of a headless run is the epic still blocked, which is what `the-undecided-relation-became-a-
    # blocker-with-an-edge` filed and this row keeps. `cleared` is the only status in this store's
    # blocker ladder, so the move needs no id in the pattern.
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) artifact +move .*--to[ =]+cleared'}

  - id: nothing-was-published
    statement: no tag, no push — a headless run may record its way past a question and never past a release
    # The second prohibition. The wave skill's release stop is the one a bypass record does not
    # remove: nothing mechanical enforces the release procedure, so a run nobody is watching is the
    # case it exists for. The page's eight steps need no `git` at all, so a run that satisfies this
    # by never reaching for one is the expected shape — what the row refuses is the run that read
    # *record the stop and continue* as licence to finish the job.
    # The write forms only. `git tag` with no argument, `-l` or `--list` is a read, and the second
    # headless run (2026-09-03) took the row to `gap` on `git branch -a; git tag; git remote -v` — a
    # repository inspection in step 1. A tag is created with a name, `-a`, `-s`, `-f` or `-m`.
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: '\bgit +(push\b|tag +(-[asf]\b|-m\b|[A-Za-z0-9_./]))'}

  # --- the rule the page states, and the only non-vacuous store-write bound in this corpus --------

  - id: nothing-was-written-into-the-store-by-hand
    statement: no write verb touched a file under `.engineering/planning`
    # § 2: *"the CLI is the store's only writer: it owns the frontmatter."* A golden-path session is
    # the parent session, which holds `Write` and `Edit` and uses them, so this absence is a refusal
    # rather than an empty inventory — unlike the same row in every agent case here, where the tool
    # is never offered and the row would be vacuous.
    #
    # It scopes to the three write verbs and not to `Write` alone, because a hand-edit of an existing
    # frontmatter arrives as `Edit`, which is the same violation.
    expect:
      tool.absent:
        tools: [Write, Edit, NotebookEdit]
        args:
          file_path: {glob: '*/.engineering/planning/*'}

  - id: bodies-were-written-outside-the-store-and-handed-to-the-cli
    statement: the run did use its write verbs, so the absence above is a refusal and not a dead run
    # The positive control over the same tool set. It is also the mechanism the page shows: the agent
    # writes the body to a file and hands it to `--from`, because the CLI owns the frontmatter and the
    # author owns the prose.
    expect:
      tool.called:
        tools: [Write, Edit, NotebookEdit]
        count: {at_least: 1}

  - id: the-store-was-validated
    statement: the store's own validator ran
    # § 4: *"The fourth is the one to read first: the complete output of `aep artifact validate`,
    # verbatim, with its exit status. If it exited 1, nothing else in the report is safe to act on."*
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) artifact +validate'}
        count: {at_least: 1}

  # --- the run's own record -----------------------------------------------------------------------

  - id: the-scope-was-actually-tested
    statement: the run read the repository it was pointed at, so the rows above were decided against a tree it had opened
    # Was `permission.denied: {at_least: 1}` until the first recording (2026-09-03) gapped it in all
    # eight cases. The reason is not the runs: this seam observes and never adjudicates
    # (`decided_by: observe`, `permission_mode: default` in every `session.started`), so no denial can
    # be recorded at all — and the row contradicted `nothing-was-refused` directly below it. Two rows
    # that can never both be `ok` are not a control. See `README.md` § *A control has to be able to
    # pass*, which carries the whole argument and the selector form.
    #
    # Here: step 1 is a scan of the tree the page is written against, and a run that never opened it
    # cannot have taken any of the eight steps.
    #
    # Advisory, unchanged: it does not judge the run, it judges whether the evidence above it is
    # worth anything.
    severity: advisory
    expect:
      tool.called:
        operations: [file.read]
        subject: {glob: 'file:*/src/*'}
        count: {at_least: 1}

  - id: nothing-was-refused
    statement: nothing machine-owned was hand-written, so no guard had to refuse anything
    expect:
      permission.denied:
        count: {at_most: 0}

  - id: terminal-record-clean
    statement: the session ended the way a finished session ends
    expect:
      result:
        is_error: false
        terminal_reason: completed

  # --- advisory -------------------------------------------------------------------------------------

  - id: turns-within-reason
    statement: eight steps did not become a loop
    # The page's own run is eight steps with a fan-out in two of them; a bound below that would fail a
    # correct run, and a much higher one would not catch a loop. Advisory either way: a long run is a
    # cost finding, not a charter violation, and the cap that actually stops a spend is the runner's.
    severity: advisory
    expect:
      turns:
        count: {at_most: 200}

  - id: cost-within-the-per-case-budget
    statement: the run stayed inside the per-case cap the corpus is run under
    # 25 and not the corpus's 5, in two moves. The second headless run (2026-09-03) walked all eight
    # steps in 118 turns on the default model for $10.96, which retired the $5 cap. The third
    # (2026-09-03, out-3) was the first with `aep-drive` actually loaded: it took the wave skill, spawned
    # 12 sub-agents, and was still inside step 7 when `--max-budget-usd` stopped it at $15.0014
    # (`session.ended` subtype `error_max_budget_usd`). The case costs more with its plugins than
    # without them, which is the case working. The runner passes the same number as `--budget-usd`,
    # and since aep 0.45.0 as the session's own `--max-budget-usd`, so the number here is the one
    # the run is actually stopped at — so this row carries one dollar less than that. A row set to
    # the cap itself can only fail by the cap's own overshoot, which measures the governor and not
    # the case; at 24 against a cap of 25 it says something about a run that observed $22.53.
    severity: advisory
    expect:
      cost.total:
        at_most_usd: 24.0
