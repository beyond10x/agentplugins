format: eval-case/1
id: golden-path-end-to-end
title: The published golden path, run end to end, on a repository that has never been planned
workflow: adp/default
states: [receive, specify, decompose, establish_verifiers, implement]
arm: plugin
verdict: held

# Which repository files this case is a case about. `task check` refuses a case whose `agents:` or
# `skills:` name nothing that exists, and `.github/workflows/eval.yml` scopes a live run to the
# cases whose subject the pull request touched.
subject:
  agents: [aep-planning:decomposer, aep-planning:plan-critic-acceptance, adp:story-scoper]
  skills: [aep-planning:planning, ess-schema:ess-schema, adp:wave, adp:drive]
  paths:
    - website/docs/golden-path.md

# **The only case here whose subject is a published page.** `website/docs/golden-path.md` is eight
# numbered steps an adopter is told to paste, and every console block on it is stated to be the
# output of actually running the command above it. That claim decays silently: a plugin edit changes
# what the agent does, the page keeps its recorded output, and the first person to notice is an
# adopter whose run did something else.
#
# So this case's `task:` is the page's eight prompts, concatenated, in the page's own order and
# wording. What the rows below assert is the **shape the page promises** — the orderings, and the
# one bound the page states as a rule rather than as a step.
#
# ## The bound the page states as a rule
#
# § 2: *"the CLI is the store's only writer: it owns the frontmatter."* Every other case in this
# corpus has to drop its store-write absence as vacuous, because a critic or a decomposer is never
# offered `Write`. **A golden-path session is the parent**, it holds `Write` and `Edit`, and it uses
# them — the bodies it hands to `--from` are files it wrote outside the store. So
# `nothing-was-written-into-the-store-by-hand` is a refusal here, with its control over the same tool
# set, and it is the strongest row on the page.
#
# ## Why the task opens with an instruction the page does not number
#
# The first headless run of this case — one `aep eval run` session, 2026-09-03 — adopted the
# repository, scanned it, reported *step 1 — adopted, scanned* and ended, with ten rows gapped and
# seven held. Nothing it did was wrong. The page is eight prompts an operator types across eight
# turns, and a case is one task with no operator turn in it, so the run reached the first stop and
# there was nobody to continue it.
#
# So the task carries the page's own § *Running it without an operator* instruction, verbatim, in
# front of the eight prompts. It is the same sentence an adopter is told to give, which is what keeps
# this case a case about the published page: a case that invented its own way past the stops would
# measure a run nobody was told how to launch.
#
# The rows it adds are about the **record**, not about the continuing. A run that walked all eight
# steps and wrote nothing down would satisfy every ordering row in this document and would be exactly
# the failure the instruction is guarding against — an agent that decided eight things on an
# operator's behalf and left no trace of any of them.
#
# ## Cost, and why this case is the expensive one
#
# Eight steps, an ESS model, a decomposer, three scopers, a critic panel, and an experimental driven
# run on a tree that has to be built first.
# It is the case a full sweep's budget is mostly spent on. `story:plugin-eval-cases` resolves the
# per-case cap to `--budget-usd 5`; the advisory cost row carries that number so a run that came in
# far under or far over it is visible in the matrix rather than only in a receipt.
#
# ## The spelling of the CLI, and why the rows carry both
#
# `aep` in this repository's instructions, `protocol` in the binary's own usage lines, and an adopter
# may have either on `PATH`. Every matcher below is a regex over both.

task: |
  Work this repository through the published golden path, in these eight steps, reporting at the end
  of each one before you start the next.

  Run this without stopping: no operator is present, so at every point you would pause for one — the
  wave proposal, a critic round, a blocker, a move the store gates on evidence — record one
  `approval-record` through `aep artifact new`, tagged `non-interactive`, naming the stop and what you
  decided in the operator's absence, and continue. Do not clear a blocker, do not publish and do not
  release.

  1. Adopt this repository for AEP planning. Run `aep reverse init` with the protocol source the
     project pins and the profile `development.standard`, then run `aep reverse scan`. Report what
     the scan found, and file nothing yet.

  2. File this as an epic in the planning store, and stop there — do not decompose it yet:

       A commercial client is a record of its own. It belongs to exactly one account. A caller can
       create, read, update and delete a commercial client.

     Cite what in this repository the epic rests on.

  3. `epic:commercial-clients` introduces a noun with no typed home. Draft the smallest `ess/1`
     domain that declares it and its relation to the account, validate it, and mark anything you
     cannot read from this repository as `UNMAPPED:` rather than guessing it.

  4. Decompose `epic:commercial-clients`. Before you draft a single story, list every domain relation
     the epic implies — entity to entity, cardinality, ownership, lifecycle coupling — and classify
     each one as inferable, with the `path:line` or artifact that settles it, or as needing a
     stakeholder decision. Draft no story that depends on a relation you could not settle.

  5. Scope each draft story under `epic:commercial-clients`: which files and symbols does it touch?
     Mark every line as cited or inferred, say what you could not establish, and write each scope
     back into its story's body.

  6. Run the plan critics over `epic:commercial-clients` and its stories. Record every verdict,
     revise the drafts that come back needing revision, stop after two rounds, and list what is still
     open.

  7. Take `story:commercial-client-record` through the adp wave: scope it into units, implement the
     units, and have the adversary review the result against the story's acceptance and this
     repository's gate. Walk the story's lifecycle deliberately, and say that you did.

  8. Drive `story:commercial-client-record`. Run `aep doctor` first and stop if anything fails, tell
     me what the run will cost before you launch it, and print the run id and how to follow it.

expectations: expectations.trace.yaml
recorded: recorded/

# The run did nothing wrong; what gaps is an observation about the evidence, not about the run.
advisory_gaps:
  - expectation: the-scope-was-actually-tested
    why: >-
      No transcript is recorded for this case yet, so nothing has tested the guardrail rows. When
      one is, this line states what that run's `permission_denials` said rather than predicting it.
