format: trace-spec/1
id: eval-case/plan-critic-scope-verdict
title: The scope critic argued, the caller recorded the verdict, and nothing moved

# **No row here reads `plugins/aep-plan/agents/plan-critic-scope.md`.** A check that greps an
# agent's markdown asserts that a sentence is still written, which is the failure mode a behavioural
# case exists to remove. Every row below is about what the run did.
#
# Every negative bound has a positive control over the **same tool**, because `tool.absent` is green
# against a transcript carrying none of the agent's calls at all. If a harness stops surfacing a
# subagent's tool calls in the session transcript, the control goes red and this case fails loudly
# instead of reporting a green wall of vacuous absences.

expectations:
  # --- the agent was reached at all ----------------------------------------------------------

  - id: the-critic-was-offered
    statement: the plugin loaded and offered the scope critic, so a miss is not "it was not there"
    expect:
      env.agent_available:
        agent: aep-plan:plan-critic-scope

  - id: a-subagent-actually-ran
    statement: the critique went through a subagent rather than being improvised by the parent session
    # Without it the whole case is green when the agent was never reached: the parent would have
    # made the same CLI calls and satisfied every other row.
    expect:
      subagent.spawned:
        count: {at_least: 1}

  # --- the verdict became evidence ------------------------------------------------------------

  - id: the-verdict-is-a-review-result-created-from-a-body-file
    statement: the caller recorded the verdict as a `review-result` whose body arrived with the record
    # `review-result` is immutable — `aep plan artifact new --help` says it *"refuses every edit after the
    # fact, which is what makes it evidence"* — so `--from` is not one way to write the body, it is
    # the only one. A row asserting `artifact new review-result` alone would pass on a record whose
    # body is still the kind's template.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(?s)(aep|protocol) +(plan +)?artifact new +review-result.*--from'}
        count: {at_least: 1}

  - id: the-critic-read-the-store-before-judging
    statement: the run ran the store's read verbs, so the absences below are refusals and not an empty transcript
    # The positive control, over the same tool the absences are scoped to. It is also the
    # non-vacuity floor: a verdict over a set nobody opened is an empty `approve`.
    #
    # Read: `aep plan artifact show <parent>` before any item, then `aep plan artifact graph` — the agent file makes the parent-first order the difference between a coverage check and a confirmation of one.
    expect:
      tool.called:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) +(plan +)?artifact (show|graph)'}
        count: {at_least: 1}

  # --- proposes, never performs ---------------------------------------------------------------

  - id: nothing-was-moved
    statement: no artifact was promoted on the strength of a verdict
    # The charter's bound, stated as a fact about the run's shell calls: `artifact move` is the only
    # verb that changes a status, and the store's frontmatter is the CLI's.
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) +(plan +)?artifact +move'}

  - id: no-judged-body-was-rewritten
    statement: the critic's verdict did not turn into an edit of the thing it judged
    # One round was asked for. A panel loop revises drafts through `aep plan artifact body` on
    # `needs-revision`, and that is correct behaviour in a panel case; it is not this case, whose
    # task says one round and no revision.
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: '(aep|protocol) +(plan +)?artifact +body'}

  # --- the run's own record -------------------------------------------------------------------

  - id: the-scope-was-actually-tested
    statement: the run used a write verb on the verdict body outside the store, so the bounds above were decided against a run that had somewhere to write
    # Was `permission.denied: {at_least: 1}` until the first recording (2026-09-03) gapped it in all
    # eight cases. The reason is not the runs: this seam observes and never adjudicates
    # (`decided_by: observe`, `permission_mode: default` in every `session.started`), so no denial can
    # be recorded at all — and the row contradicted `nothing-was-refused` directly below it. Two rows
    # that can never both be `ok` are not a control. See `README.md` § *A control has to be able to
    # pass*, which carries the whole argument and the selector form.
    #
    # Here: the body handed to `--from` above is a file this run authored with its own write verb, so
    # `the-verdict-is-a-review-result-created-from-a-body-file` records a body rather than a path that
    # happened to be lying there.
    #
    # Advisory, unchanged: it does not judge the run, it judges whether the evidence above it is
    # worth anything.
    severity: advisory
    expect:
      tool.called:
        operations: [file.write, file.edit]
        subject: {glob: 'file:*.md'}
        count: {at_least: 1}

  - id: nothing-was-refused
    statement: nothing machine-owned was hand-written, so no guard had to refuse anything
    expect:
      permission.denied:
        count: {at_most: 0}

  - id: terminal-record-clean
    statement: the session ended the way a finished session ends
    expect:
      result:
        is_error: false
        terminal_reason: completed

  # --- advisory --------------------------------------------------------------------------------

  - id: the-report-carried-one-of-the-two-verdict-words
    statement: the final text carries `approve` or `needs-revision`
    # `text.matches` is the weakest kind in the vocabulary and its own documentation says to avoid it
    # everywhere else. Advisory for exactly that reason, and for a second one that is specific here:
    # it reads the **session's** final text, which is the caller's summary and not the critic's first
    # line. The verdict's real home is `the-verdict-is-a-review-result-created-from-a-body-file`.
    severity: advisory
    expect:
      text.matches:
        regex: '(approve|needs-revision)'

  - id: turns-within-reason
    statement: the critique did not loop
    severity: advisory
    expect:
      turns:
        count: {at_most: 40}

  - id: cost-within-the-per-case-budget
    statement: the run stayed inside the per-case cap the corpus is run under
    # `story:plugin-eval-cases` resolves the per-live-run budget to `--budget-usd 5` per case.
    # Advisory: a cold cache or a longer argument is not a charter violation, and a cost row that
    # gates would turn a correct run red for a reason that is not about behaviour. The cap that
    # actually stops a spend is the runner's, checked before each spawn.
    severity: advisory
    expect:
      cost.total:
        at_most_usd: 5.0
