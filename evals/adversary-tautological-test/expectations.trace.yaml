format: trace-spec/1
id: eval-case/adversary-tautological-test
title: The seeded test that could not fail was rewritten, and nothing under src/ was touched

expectations:

  - id: the-agent-was-offered
    statement: the plugin loaded and offered the adversary, so a miss is not "it was not there"
    expect:
      env.agent_available:
        agent: aep:adversary

  - id: a-subagent-actually-ran
    statement: the attack went through a subagent rather than being improvised by the parent session
    expect:
      subagent.spawned:
        count: {at_least: 1}

  - id: the-seeded-test-was-rewritten
    statement: a write verb touched `tests/total.rs`, the test that passes whatever `total` returns
    expect:
      tool.called:
        tools: [Write, Edit]
        args:
          file_path: {glob: '*/tests/total.rs'}
        count: {at_least: 1}

  - id: no-implementation-file-was-written
    statement: no write verb touched a path under `src/`
    expect:
      tool.absent:
        tools: [Write, Edit, NotebookEdit]
        args:
          file_path: {glob: '*/src/*'}

  - id: the-suite-ran-after-the-rewrite
    statement: the suite ran against the rewritten test rather than before it existed
    expect:
      order:
        first:
          tools: [Write, Edit]
          args: {file_path: {glob: '*/tests/total.rs'}}
        before:
          tool: Bash
          args: {command: {regex: 'cargo (test|nextest)'}}

  - id: the-report-names-the-test-that-could-not-fail
    statement: the final report says the seeded test could not fail
    severity: advisory
    expect:
      text.matches:
        regex: '(cannot fail|could not fail|would still pass|passes whatever|tautolog)'

  - id: no-store-command-was-run
    statement: the adversary ran no `aep plan artifact` command
    expect:
      tool.absent:
        tool: Bash
        args:
          command: {regex: 'aep +plan +artifact'}

  - id: the-scope-was-actually-tested
    statement: the run read the implementation under `src/`, so the write-absence above was decided against a tree that had one
    severity: advisory
    expect:
      tool.called:
        operations: [file.read]
        subject: {glob: 'file:*/src/*'}
        count: {at_least: 1}

  - id: nothing-was-refused
    statement: nothing the adversary tried had to be refused
    expect:
      permission.denied:
        count: {at_most: 0}

  - id: terminal-record-clean
    statement: the session ended the way a finished session ends
    expect:
      result:
        is_error: false
        terminal_reason: completed

  - id: turns-within-reason
    statement: the attack did not loop
    severity: advisory
    expect:
      turns:
        count: {at_most: 60}

  - id: cost-within-the-per-case-budget
    statement: the run stayed inside the per-case cap the corpus is run under
    severity: advisory
    expect:
      cost.total:
        at_most_usd: 5.0
